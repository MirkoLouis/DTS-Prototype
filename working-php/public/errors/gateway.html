<!DOCTYPE html>
<!--
    Shown by NGINX itself (nginx/site.conf: error_page 502 503 504) when PHP-FPM cannot be reached, so PHP cannot
    render it. Static and self-contained: readable without /css/tailwind.css and without JavaScript. The wording
    follows the PHP error page (src/Views/errors/error.php); this file is the only place for the gateway wording.
-->
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The system is temporarily unavailable — DepEd DTS</title>
    <style>
        /* Readable on its own (light and, by device setting, dark); element selectors, so Tailwind classes win when loaded */
        body { margin: 0; font-family: system-ui, sans-serif; background: #f3f4f6; color: #1f2937; }
        main { max-width: 28rem; margin: 4rem auto; padding: 2rem; background: #ffffff; border-radius: 0.5rem; text-align: center; }
        h1 { font-size: 1.5rem; margin: 0; }
        p { color: #4b5563; font-size: 0.875rem; margin: 1rem 0 0; }
        main a { display: inline-block; margin-top: 1.5rem; padding: 0.5rem 1rem; background: #1d4ed8; color: #ffffff; border-radius: 0.375rem; font-weight: 600; text-decoration: none; }
        @media (prefers-color-scheme: dark) {
            body { background: #111827; color: #f3f4f6; }
            main { background: #1f2937; }
            p { color: #9ca3af; }
        }
    </style>
    <link href="/css/tailwind.css" rel="stylesheet">
</head>
<body>
    <main class="max-w-md w-full mx-auto rounded-lg shadow-md p-8 text-center">
        <h1 class="text-2xl font-semibold">The system is temporarily unavailable</h1>
        <p class="text-sm">The system could not be reached just now. Wait a moment and reload this page. If it keeps happening, contact the administrator.</p>
        <!-- An empty address is the current page, so this reloads it without JavaScript -->
        <a href="" class="inline-flex items-center px-4 py-2 bg-accent-1 text-white rounded-md font-semibold text-xs uppercase tracking-widest">Reload</a>
    </main>
</body>
</html>
