# =============================================================================
# DTS Prototype — NGINX site template
# Managed by scripts/dev.php and scripts/prod.php — do not edit the installed
# copy at /etc/nginx/sites-available/dts-prototype; edit this file instead.
# Placeholders replaced at startup:
#   __PROJECT_ROOT__  → absolute path to the project
#   __PHP_VERSION__   → detected PHP version (e.g. 8.5)
#   __LAN_IP__        → detected LAN IP of this machine
#   Two more placeholders (SECURITY_HEADERS and HIDDEN_PHP_HEADERS, in underscores) hold generated multi-line
#   blocks: the add_header lines for the security headers and the fastcgi_hide_header lines for the same headers,
#   generated from App\Common\Http\SecurityHeaders (the single source of the policy text). They are not named
#   with their underscores in this comment, because the comment itself would be substituted.
# =============================================================================
server {
    listen 8000 ssl;
    # Accept requests to localhost, the LAN IP, or any other hostname.
    # _ is a catch-all; the explicit entries improve SSL SNI matching.
    server_name localhost __LAN_IP__ _;

    root "__PROJECT_ROOT__/public";

    # SSL Configuration (cert is auto-generated by dev.php/prod.php with
    # SANs for localhost + current LAN IP so browsers show the bypass prompt)
    ssl_certificate     /etc/ssl/certs/dts_prototype.crt;
    ssl_certificate_key /etc/ssl/private/dts_prototype.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    access_log /var/log/nginx/dts_access.log;
    error_log  /var/log/nginx/dts_error.log;

    index index.php index.html;

    # Do not tell visitors the NGINX version (Server header and error pages)
    server_tokens off;

    # Security headers (Content Security Policy, X-Frame-Options, X-Content-Type-Options, Referrer-Policy).
    # They are set here, at server level, so they reach everything NGINX answers itself: static files, the gateway
    # error page and NGINX's own error responses (always = on error statuses too). This is the ONLY place that adds
    # them. PHP sends the same headers (SecurityHeaders::send(), needed for the built-in server), so the PHP
    # location below drops PHP's copy: a response carries each header exactly once.
    # Do not add add_header lines to any location: a location that defines its own add_header stops inheriting these.
__SECURITY_HEADERS__

    # When PHP-FPM cannot be reached (not running, overloaded, timed out) NGINX answers 502, 503 or 504 itself;
    # show the static page instead of its bare default, keeping the original status code
    error_page 502 503 504 /errors/gateway.html;
    location = /errors/gateway.html {
        internal;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php__PHP_VERSION__-fpm.sock;

        # PHP's own copy of the security headers is dropped (the server-level add_header lines add them once), and
        # X-Powered-By is never passed on.
        # Consequence: a security header that PHP sets for a single response (a different policy for one route) is dropped
        # behind NGINX. A per-route policy must be added in SecurityHeaders AND in this template together.
__HIDDEN_PHP_HEADERS__
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }

    client_max_body_size 20M;
}